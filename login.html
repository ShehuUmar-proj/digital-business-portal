<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BizReg</title>
    <link rel="stylesheet" href="assets/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <div class="logo"><i class="fas fa-briefcase"></i><span>BizReg</span></div>
                <h1>Welcome Back</h1>
                <p>Login to your account</p>
            </div>

            <div class="auth-tabs">
                <button class="tab-button active" data-tab="login">Login</button>
                <button class="tab-button" data-tab="register">Register</button>
            </div>

            <div class="tab-content active" id="login-tab">
                <form class="auth-form" id="loginForm">
                    <div class="form-group">
                        <label>Email Address *</label>
                        <input type="email" required placeholder="your@email.com">
                    </div>
                    <div class="form-group">
                        <label>Password *</label>
                        <div class="password-input">
                            <input type="password" required placeholder="Enter password" id="loginPassword">
                            <button type="button" class="password-toggle" onclick="togglePassword('loginPassword')"><i class="fas fa-eye"></i></button>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary full-width">Login</button>
                </form>
            </div>

            <div class="tab-content" id="register-tab">
                <form class="auth-form" id="registerForm">
                    <div class="form-group">
                        <label>Full Name *</label>
                        <input type="text" required placeholder="Your name">
                    </div>
                    <div class="form-group">
                        <label>Email *</label>
                        <input type="email" required placeholder="your@email.com">
                    </div>
                    <div class="form-group">
                        <label>Password *</label>
                        <input type="password" required placeholder="Create password" id="registerPassword">
                    </div>
                    <button type="submit" class="btn btn-primary full-width">Create Account</button>
                </form>
            </div>
        </div>

        <div class="auth-info">
            <div class="info-item"><i class="fas fa-lock"></i><h3>Secure</h3><p>Military-grade encryption</p></div>
            <div class="info-item"><i class="fas fa-fingerprint"></i><h3>Safe</h3><p>2FA available</p></div>
            <div class="info-item"><i class="fas fa-mobile-alt"></i><h3>Mobile Ready</h3><p>Works everywhere</p></div>
        </div>
    </div>

    <footer class="footer auth-footer">
        <div class="footer-bottom">
            <p>&copy; 2024 BizReg.</p>
        </div>
    </footer>

    <script src="assets/script.js"></script>
    <script>
        document.querySelectorAll('.tab-button').forEach(button => {
            button.addEventListener('click', function() {
                const tabName = this.getAttribute('data-tab');
                document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                this.classList.add('active');
                document.getElementById(tabName + '-tab').classList.add('active');
            });
        });
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            input.type = input.type === 'password' ? 'text' : 'password';
        }
    </script>
</body>
</html>
